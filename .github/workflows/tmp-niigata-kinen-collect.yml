name: tmp-niigata-kinen-collect
on:
  push:
    branches:
      - collect/2026-niigata-kinen
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collect/2026-niigata-kinen
      - name: Run helper
        run: python3 tools/tmp_collect_niigata.py
