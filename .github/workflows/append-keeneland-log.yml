name: Append Keeneland Cup logs
on: pull_request
permissions:
  contents: write
jobs:
  append:
    if: github.head_ref == 'log/2026-keeneland-cup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: log/2026-keeneland-cup
      - name: Append logs
        run: |
          python3 - <<'PY'
          import csv
          rid='2026_keeneland_cup'
          def add(p,row):
            with open(p,'a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerow(row)
          for p in ['log/races.csv','log/predictions.csv','log/bets.csv','log/rule_fires.csv']:
            with open(p,encoding='utf-8') as f:
              if any(r.get('race_id')==rid for r in csv.DictReader(f)): raise SystemExit('duplicate '+p)
          add('log/races.csv',[rid,'2026-08-23','キーンランドカップ','G3','札幌芝1200',16,'良',8.2,10,'前崩れ警戒','','','','','','','','','band=中 / 荒れ度=5 / 券種=三連複+ワイド / 堅実穴=50:50 / 予算=3000 / 天候=曇 / 含水率=ゴール前12.3%・4角12.1% / 最終更新=#更新馬場 / 馬体重=未取得'])
          names=['ナムラクララ','ルシード','パンジャタワー','エーティーマクフィ','ゾンニッヒ','ジョーメッドヴィン','マイネルジェロディ','ウインカーネリアン','イツモニコニコ','ダノンマッキンリー','リラエンブレム','レッドアヴァンティ','ロジケープ','サウンドモリアーナ','エイシンディード','ロードフォアエース']
          marks=['-','-','◎','-','-','-','x','○','-','-','-','-','▲','☆','△','☆']; base=[75,73,88,80,66,61,58,86,68,77,70,65,79,74,78,72]; coef=[1.10,1.10,1.20,1,1,1,1,1.10,1,1,1,1,1.10,1.10,1.10,1.10]; additive=[1,-2,-4,-3,-2,4,2,-2,5,0,2,3,0,3,0,2]; radj=[2,0,-2,0,0,4,4,0,4,0,2,4,0,2,0,2]; final=[83.5,78.3,101.6,77,64,65,60,92.6,73,77,72,68,86.9,84.4,85.8,81.2]; myomi=[1,1,0,0,0,2,2,0,2,0,0,2,0,1,1,1]; pop=[8,6,1,4,10,14,16,3,13,7,11,15,2,5,9,12]; win=[15.9,15.1,2.3,10.8,24,89,179.8,9.9,52.1,15.6,35,132.3,5.7,14.7,16.5,41.2]; place=[4.8,5.5,1.3,4.1,10.7,13.2,34,4.7,12.6,5.4,9.6,21.8,2.4,4.6,5.7,10.5]; rv=[3.31,2.75,1.77,2.63,2.24,6.74,5.29,2.11,4.13,2.89,3.65,6.07,2.38,3.20,2.89,3.92]
          # SCHEMA_V3 requires aptitude tags. These are recovered source facts from the prediction session.
          bb=['5走距離帯=1200:良:1着:OP;1200:稍重:2着:OP;1400:良:12着:L;1400:良:8着:G3;1200:稍重:6着:OP / 父=アドマイヤマーズ / 母父=Storm Cat','5走距離帯=1200:良:2着:OP;1200:稍重:12着:G3;1200:良:1着:3勝;1200:良:2着:3勝;1200:良:1着:2勝 / 父=スクリーンヒーロー / 母父=ロージズインメイ','5走距離帯=1600:良:5着:G1;1200:良:4着:G1;1351:良:5着:G2;1500:重:5着:海外;1200:良:1着:G3 / 父=タワーオブロンドン / 母父=ヴィクトワールピサ','5走距離帯=1200:稍重:2着:G3;1200:良:8着:G1;1200:良:8着:G3;1200:良:1着:G3;1200:良:7着:G3 / 父=マクフィ / 母父=ハーツクライ','5走距離帯=1200:良:4着:OP;1600:稍重:7着:G3;1600:良:5着:L;1600:良:11着:OP / 父=ラブリーデイ / 母父=ディープインパクト','5走距離帯=1200:良:8着:OP;1200:稍重:6着:OP;1200:稍重:8着:G3;1200:良:3着:OP;1200:良:10着:L / 父=ドレフォン / 母父=キングヘイロー','5走距離帯=1200:良:6着:OP;1200:良:14着:OP;1200:稍重:11着:OP;1200:重:18着:L / 父=スクリーンヒーロー / 母父=ロージズインメイ','5走距離帯=1200:良:3着:G1;1200:良:11着:G1;1200:良:1着:G1;1200:良:5着:G3 / 父=スクリーンヒーロー / 母父=マイネルラヴ','5走距離帯=1200:良:10着:G3;1200:重:4着:G3;1200:良:13着:OP;1200:良:12着:OP;1200:良:1着:3勝 / R25精査=済 / 父=ビッグアーサー / 母父=ダンスインザダーク','5走距離帯=1200:良:4着:OP;1200:稍重:4着:G3;1400:良:15着:G2;1200:良:7着:G1;1200:良:15着:G3 / 父=モーリス / 母父=Holy Roman Emperor','5走距離帯=1800:良:12着:OP;1800:良:5着:L;2400:良:10着:G1;1800:良:7着:G3 / 父=キズナ / 母父=Galileo','5走距離帯=1200:良:5着:OP;1200:良:2着:OP;1200:稍重:4着:OP;1200:良:16着:OP;1200:良:12着:OP / 父=ドゥラメンテ / 母父=Invincible Spirit','5走距離帯=1200:良:1着:3勝;1400:良:1着:2勝;1200:良:1着:1勝;1200:良:3着:1勝;1200:良:1着:未勝利 / 父=ロジユニヴァース / 母父=ハーツクライ','5走距離帯=1200:重:6着:G3;1200:良:1着:OP;1200:良:1着:3勝;1200:良:3着:3勝;1200:良:9着:3勝 / 父=ミッキーアイル / 母父=ケイムホーム','5走距離帯=1200:良:6着:G3;1400:良:2着:G3;1600:良:4着:G2;1200:良:1着:G3;1000:良:1着:地方 / 父=ファインニードル / 母父=キングカメハメハ','5走距離帯=1200:良:5着:OP;1200:稍重:8着:OP;1200:良:12着:L;1200:良:9着:G3;1200:良:1着:L / 父=ロードカナロア / 母父=War Front']
          for i in range(16):
            nonr=additive[i]-radj[i]; ab=f'R{radj[i]:+g};工程6非R加算{nonr:+g}'; cb=f'適性{coef[i]:.2f};バイアス1.00'
            add('log/predictions.csv',[rid,i+1,names[i],marks[i],base[i],bb[i],f'{coef[i]:.2f}',cb,additive[i],ab,radj[i],final[i],myomi[i],pop[i],win[i],place[i],rv[i],'','','','','元セッション工程6の再計算値から復元 / as_of=良・クッション8.2'])
          add('log/bets.csv',[rid,'三連複','軸1頭(3)流し・相手6頭(1,8,13,14,15,16)',15,100,1500,'','','side=堅実 / ☆14・16保全'])
          add('log/bets.csv',[rid,'ワイド','3-8/3-13/8-13/13-14/14-16',5,'',1500,'','','side=穴 / 金額=400/400/300/200/200 / ☆14・16保全'])
          fired={1:'◎3維持',7:'x7精査',8:'ペース10ロック',11:'15降格・14再評価',15:'印上限遵守',16:'総額3000',18:'根拠記録',19:'閾値固定',22:'数値検算',25:'9を5走精査',28:'中帯域50:50',31:'軸抜け生存',32:'券種間突合',35:'☆14 R3.20・☆16 R3.92を例外根拠+両券種保全',36:'3-8直積',37:'非軸3ペア',38:'11短縮精査'}
          for n in range(1,39): add('log/rule_fires.csv',[rid,f'R{n:02d}',1 if n in fired else 0,1,'','',(fired.get(n,'非発火')+' / as_of=良・クッション8.2')])
          PY
      - run: python3 log/validate.py
      - run: python3 log/gate.py
      - name: Commit logs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add log/races.csv log/predictions.csv log/bets.csv log/rule_fires.csv
          git commit -m 'log: add 2026 Keeneland Cup prediction'
          git push origin HEAD:log/2026-keeneland-cup
