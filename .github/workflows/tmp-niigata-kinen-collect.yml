name: tmp-niigata-kinen-collect
on:
  push:
    branches: [collect/2026-niigata-kinen]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: collect/2026-niigata-kinen
      - name: Update existing knowledge and CSV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          course = Path('references/コース別_脚質枠_補正表_夏開催追記.md')
          text = course.read_text(encoding='utf-8')
          marker = '## 夏開催の共通レジーム'
          block = r'''
---

## ⑲ 新潟 芝2000m（外）

**主な重賞：** 新潟記念（8月末・G3・サマー2000。2025年からハンデ→別定）、新潟大賞典（春・G3・ハンデ）

**形態：** 左回り・外回り。2コーナー奥のポケットから発走し、外回り3コーナーまで約950m。バックストレッチ中盤過ぎから3コーナー途中まで緩やかに上り、4コーナーへ向けて緩やかに下る。直線は658.7mで芝直線1000mを除くJRA最長。コーナーは2つだけで、直線はほぼ平坦。形態数値はJRA公式「新潟記念 歴史・コース」「新潟競馬場馬場概要」を正本とする。

**コース性質：** 瞬発寄りの二面性。長い直線と少ないコーナーにより末脚性能が強く問われる一方、馬群が一団で進みやすく、スローなら前も止まり切らない。新潟記念過去10年では逃げ【0-1-0-9】、追込【3-5-5-29】で追込の複勝率31.0%。上がり最速は【5-2-2-3】で複勝率75.0%。したがって「直線長＝追込固定」ではなく、**上がり上位を出せる位置取り自在性**を主評価とする。

**要求プロファイル：**
- 主要素：長い直線で上がり上位を使える末脚 ／ 直線まで脚を温存できる折り合い ／ 2000mでの持続加速
- 加点要素：新潟外回り実績 ／ 差し・追込でも4角で置かれすぎない自在性 ／ 継続騎乗
- ミスマッチ：逃げ切り一辺倒 ／ 上がり6位以下が常態の先行押し切り専用型

| 適性タイプ | 係数 |
|---|---|
| 上がり上位常連＋新潟外回り実績 | ×1.2 |
| 好位〜中団から長く脚を使える持続差し | ×1.1 |
| 標準 | ×1.0 |
| 逃げ切り一辺倒／末脚不足 | ×0.85 |

**補足（レース固有データの所在）：** 新潟記念の人気・枠・脚質・ローテ・年齢・配当レンジは『レース別_過去傾向データ.md』⑳を正本とする。2025年から別定戦へ変更されたため、2016〜2024のハンデ戦傾向を斤量構造の根拠として2026へ直接外挿しない。近年2020〜2025は1〜2枠【0-0-0-19】だが、コース形態に内枠不利の明確な構造説明がないため**消し級にせず加算層どまり**とする。

**妙味係数（末脚・中穴型）：** 前向き脚質トリガー×0.7 ／ 末脚トリガー×1.4 ／ R・中穴（6〜10人気）×1.2 ／ 枠×1.0。数値は初期値で、log/で結果を記録しながら調整し、単一レースで書き換えない。

'''
          if '## ⑲ 新潟 芝2000m（外）' not in text:
              text = text.replace(marker, block + marker)
              course.write_text(text, encoding='utf-8')

          race = Path('references/レース別_過去傾向データ.md')
          rtext = race.read_text(encoding='utf-8')
          rblock = r'''

---

## ⑳ 新潟記念（新潟芝2000m外・2016〜2025）

**制度注意：** 2024年まではハンデ、2025年から別定。2026年も別定。斤量に関するハンデ戦時代の癖は構造フィルタへ昇格させない。

### 人気
JRA公式2026年版の過去10年では、1人気【1-3-1-5】複勝50.0%、2人気【5-0-1-4】複勝60.0%、3人気【0-3-1-6】複勝40.0%。一方、4人気【0-0-0-10】、5人気【0-0-1-9】で、6〜10人気【3-4-4-39】＝11頭が3着内、11人気以下【1-0-2-57】＝3頭。**6人気以下が30頭中14頭を占める中穴〜大穴混在型**。4〜5人気不振は構造説明が弱いため消しではなく加算層-1まで。

### 年齢
3歳【2-1-1-4】複勝50.0%、4歳【3-3-3-26】25.7%、5歳【3-3-3-45】16.7%、6歳【2-1-0-24】11.1%、7歳【0-1-3-23】14.8%、8歳【0-1-0-7】12.5%。3〜5歳が30頭中22頭。**若い馬優勢は加点材料**だが、7〜8歳にも連対例があるため高齢だけで消さない。

### 枠
過去10年は1枠【2-0-0-15】、2枠【0-0-0-16】、3枠【2-2-1-12】、4枠【2-1-2-14】、5枠【0-0-2-18】、6枠【1-3-1-15】、7枠【0-1-2-21】、8枠【3-3-2-19】。JRA公式は2020〜2025に限ると1〜2枠【0-0-0-19】、6〜8枠【3-5-4-30】複勝28.6%として「近年は外枠優勢」と整理。ただし2016〜2019を含む10年では1枠2勝があり、形態由来の明確な内不利もないため**近年の癖＝加算層±1、消し禁止**。

### 脚質・上がり
過去10年集計では逃げ【0-1-0-9】、先行【2-2-2-29】、差し【5-2-3-63】、追込【3-5-5-29】。追込は複勝31.0%で最上位。上がり1位【5-2-2-3】複勝75.0%、2位【1-2-0-6】33.3%、3位【1-1-5-4】63.6%、6位以下【2-2-1-100】4.8%。**末脚上位が最強シグナル**。逃げ不振は強いが2着例があるため単独消しにはしない。

### ローテ・騎手
2025年版JRA集計では前走G1【4-2-0-17】複勝26.1%、G3【5-5-7-69】19.8%、G2【0-1-0-12】7.7%。2026年版では前走と同じ騎手【7-6-4-39】複勝30.4%に対し乗り替わり【3-4-6-91】12.5%。**継続騎乗を+1相当の加点材料**とするが、乗り替わりだけで消さない。

### 荒れ度素材・配当レンジ
2016〜2025の三連複は12,810／27,670／25,300／21,230／6,770／28,380／91,350／61,230／4,530／3,550円。**万馬券7/10回**。単勝50倍以上の勝ち馬は0頭だが、10人気以下が【2-0-3-65】で5頭3着内。2025年の別定化初年は2-1-7人気で三連複3,550円と比較的平穏だったため、旧ハンデ期の高配当をそのまま別定戦へ固定しない。

### 負のデータ区分
- **消し級：なし。** 制度変更直後で、枠・人気・脚質の負データはいずれも例外または構造説明不足。
- **加算層どまり：** 4人気不振、5人気不振、近年1〜2枠不振、逃げ不振、乗り替わり。いずれも最大-1相当。

### 穴トリガーと妙味
6人気以下の3着内が14/30で、4〜5人気より6〜10人気帯に実績が集中。脚質全体では追込・上がり上位が優勢なため、穴側は**末脚トリガー×1.4／R・6〜10人気×1.2／前向き脚質×0.7**を初期値とする。枠は10年全体と近6年で方向が揺れるため×1.0。バックテストの基準は「過去10年で6人気以下14頭を3着内に含み、追込が13頭・上がり1〜3位の複勝率が高い」こと。単一年度で係数を書き換えない。

**一次ソース：** JRA「新潟記念 データ分析（2026）」「新潟記念 歴史・コース（2026）」、JRA各年リプレイ。脚質・上がりの集計はJRA結果データを基にした公開集計を照合用に使用。
'''
          if '## ⑳ 新潟記念（新潟芝2000m外・2016〜2025）' not in rtext:
              race.write_text(rtext.rstrip() + rblock + '\n', encoding='utf-8')

          races = Path('log/races.csv')
          rows = races.read_text(encoding='utf-8')
          if '2026_niigata_kinen,' not in rows:
              row = '2026_niigata_kinen,2026-08-30,新潟記念,G3,新潟芝2000外,11,,,,,,,,,,,,,収録C0-C6完了 / 種別=コース補正表+レース別傾向 / 2025年から別定 / JRA2026過去10年=1人気複勝50.0%・2人気60.0%・6〜10人気11頭3着内 / 追込複勝31.0%・上がり1位複勝75.0% / 近6年1〜2枠0-0-0-19は加算層どまり / 三連複万馬券7/10 / 予想前メタデータ行のため馬場・ペース・結果は未記入\n'
              races.write_text(rows.rstrip('\n') + '\n' + row, encoding='utf-8')
          PY
          python3 log/validate.py || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-niigata-kinen-collect.yml
          git add references/コース別_脚質枠_補正表_夏開催追記.md references/レース別_過去傾向データ.md log/races.csv
          git commit -m '収録: 新潟芝2000外と新潟記念の傾向を追加'
          git push origin HEAD:collect/2026-niigata-kinen
