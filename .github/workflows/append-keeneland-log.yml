name: Append Keeneland Cup logs
on:
  push:
    branches: [log/2026-keeneland-cup]
    paths: [.github/workflows/append-keeneland-log.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: log/2026-keeneland-cup
      - name: Append recovered prediction logs
        run: |
          python3 - <<'PY'
          import csv
          rid='2026_keeneland_cup'
          def exists(p):
            with open(p,encoding='utf-8') as f:return any(r.get('race_id')==rid for r in csv.DictReader(f))
          paths=['log/races.csv','log/predictions.csv','log/bets.csv','log/rule_fires.csv']
          for p in paths:
            if exists(p): raise SystemExit('duplicate '+p)
          def add(p,row):
            with open(p,'a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerow(row)
          add('log/races.csv',[rid,'2026-08-23','キーンランドカップ','G3','札幌芝1200',16,'良',8.2,10,'前崩れ警戒','','','','','','','','','band=中 / 荒れ度=5 / 券種=三連複+ワイド / 堅実穴=50:50 / 予算=3000 / 天候=曇 / 含水率=ゴール前12.3%・4角12.1% / 最終更新=#更新馬場 / 馬体重=未取得'])
          names=['ナムラクララ','ルシード','パンジャタワー','エーティーマクフィ','ゾンニッヒ','ジョーメッドヴィン','マイネルジェロディ','ウインカーネリアン','イツモニコニコ','ダノンマッキンリー','リラエンブレム','レッドアヴァンティ','ロジケープ','サウンドモリアーナ','エイシンディード','ロードフォアエース']
          marks=['-','-','◎','-','-','-','x','○','-','-','-','-','▲','☆','△','☆']
          base=[75,73,88,80,66,61,58,86,68,77,70,65,79,74,78,72]
          coef=[1.10,1.10,1.20,1,1,1,1,1.10,1,1,1,1,1.10,1.10,1.10,1.10]
          # Recovered from the original Stage-6 recalculation: additive_total and r_adj were both retained.
          # non_r_add = additive_total - r_adj. No semantic label is invented here.
          additive=[1,-2,-4,-3,-2,4,2,-2,5,0,2,3,0,3,0,2]
          radj=[2,0,-2,0,0,4,4,0,4,0,2,4,0,2,0,2]
          final=[83.5,78.3,101.6,77,64,65,60,92.6,73,77,72,68,86.9,84.4,85.8,81.2]
          myomi=[1,1,0,0,0,2,2,0,2,0,0,2,0,1,1,1]
          pop=[8,6,1,4,10,14,16,3,13,7,11,15,2,5,9,12]
          win=[15.9,15.1,2.3,10.8,24.0,89.0,179.8,9.9,52.1,15.6,35.0,132.3,5.7,14.7,16.5,41.2]
          place=[4.8,5.5,1.3,4.1,10.7,13.2,34.0,4.7,12.6,5.4,9.6,21.8,2.4,4.6,5.7,10.5]
          rv=[3.31,2.75,1.77,2.63,2.24,6.74,5.29,2.11,4.13,2.89,3.65,6.07,2.38,3.20,2.89,3.92]
          notes=['UHB賞勝ち。内枠割引も三連複紐で保全','良1200は2-2-0-0。内枠で押さえまで','昨年同レース勝ち+G1級地力','G3勝ち+函館SS2着。7歳・内枠を割引','8歳。1200近走4着はあるが地力上位に届かず','Rは強いが地力側が届かない','消し。近走6/14/11/18着を精査','G1級地力。9歳を小幅割引','R25精査対象。重G3・4着を確認','唯一の追込。馬場更新後も買い目変更なし','R38発火。近5走1000-1400mなし。血統短縮加算±0','Rは高いが近走OP止まり','札幌芝1200勝ち+3連勝。全面更新で▲','R35例外。良芝1200でOP含む2勝+final5位。三連複/ワイド双方に保全','3歳G3勝ち+G3・2着。逃げ競合で△','R35例外。先行認定+父ロードカナロア適性材料+final7位。三連複/ワイド双方に保全']
          for i in range(16):
            nonr=additive[i]-radj[i]
            addbreak=f'R補正{radj[i]:+g};工程6確定の非R加算{nonr:+g}'
            coefbreak=f'適性{coef[i]:.2f};バイアス1.00'
            add('log/predictions.csv',[rid,i+1,names[i],marks[i],base[i],'',f'{coef[i]:.2f}',coefbreak,additive[i],addbreak,radj[i],final[i],myomi[i],pop[i],win[i],place[i],rv[i],'','','','',notes[i]+' / 数値内訳は元セッション工程6再計算値から復元 / as_of=良・クッション8.2'])
          add('log/bets.csv',[rid,'三連複','軸1頭(3)流し・相手6頭(1,8,13,14,15,16)',15,100,1500,'','','side=堅実。6×5÷2=15点。☆14/16保全'])
          add('log/bets.csv',[rid,'ワイド','3-8/3-13/8-13/13-14/14-16',5,'',1500,'','','side=穴。内訳=3-8:400/3-13:400/8-13:300/13-14:200/14-16:200。☆14/16保全'])
          fired={1:'◎3を複数根拠で維持',7:'x7の近走と好走条件を精査',8:'機械脚質でペース10をロック。馬場更新で前崩れ警戒',11:'15降格と14の扱いを再評価',15:'印上限遵守',16:'三連複1500+ワイド1500=3000',18:'発火行に根拠記録',19:'閾値・係数を変更せず適用',22:'数値列をvalidateで照合',25:'9イツモニコニコを5走精査',28:'中帯域の三連複+ワイド、50:50維持',31:'3軸抜けでも8-13/13-14/14-16生存',32:'券種間紐差を突合',35:'☆14 R3.20・☆16 R3.92。R<4のため非R根拠を記録し両券種保全',36:'final上位3/8の直積3-8を確保',37:'非軸ペア8-13/13-14/14-16確保',38:'11は近5走1000-1400mなし。血統短縮±0'}
          for n in range(1,39): add('log/rule_fires.csv',[rid,f'R{n:02d}',1 if n in fired else 0,1,'','',(fired.get(n,'非発火')+' / as_of=良・クッション8.2')])
          PY
      - name: Validate
        run: |
          python3 log/validate.py
          python3 log/gate.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add log/races.csv log/predictions.csv log/bets.csv log/rule_fires.csv
          git commit -m 'log: add 2026 Keeneland Cup prediction'
          git push
