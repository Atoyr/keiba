name: oneshot-niigata-kinen
on:
  push:
    branches: [feat/2026-niigata-kinen-prediction]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/2026-niigata-kinen-prediction}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Write prediction logs
        run: |
          python3 - <<'PY'
          import csv
          rid='2026_niigata_kinen'
          def ensure_nl(path):
              with open(path,'rb+') as f:
                  f.seek(0,2)
                  if f.tell() and (f.seek(-1,2) or True) and f.read(1)!=b'\n': f.write(b'\n')
          def append(path,rows):
              ensure_nl(path)
              with open(path,'a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)
          # 収録時に作成済みの races 行を予想確定値へ更新する。
          p='log/races.csv'
          with open(p,encoding='utf-8',newline='') as f: data=list(csv.reader(f))
          for i,row in enumerate(data):
              if row and row[0]==rid:
                  data[i]=[rid,'2026-08-30','新潟記念','G3','新潟芝2000外','11','','','3','前残り濃厚','','','','','','','','','band=中 / 荒れ度=3 / 券種=三連複+ワイド / 堅実穴=50:50 / 予算=3000 / 計画総額=3000 / ペース密度=0.273 / 想定馬場=良20%・稍重50%・重30% / 馬場ソース=予想時未確定']
                  break
          with open(p,'w',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(data)
          def bb(dist,sire,bms): return f'5走距離帯={dist};父={sire};母父={bms}'
          rows=[
          [rid,1,'ボーンディスウェイ','-',68,bb('2000:稍重:5着:G3;2500:良:11着:G2;2600:良:6着:OP;3400:良:9着:G3;2500:良:8着:G2','ハーツクライ','Platini'),1.0,'course=1.0;bias=1.0',2,'R+2',2,70,2,'','','',3.79,'','','','','','as_of=良20%稍重50%重30%;内枠＋近走内容で印圏外'],
          [rid,2,'サヴォーナ','-',81,bb('2000:稍重:10着:G3;2000:良:1着:L;2500:良:8着:G2;2200:良:4着:G2;2000:良:4着:G3','キズナ','スニッツェル'),1.0,'course=1.0;bias=1.0',2,'R+2',2,83,4,'','','',3.06,'','','','','','as_of=良20%稍重50%重30%;押し出され先行なら残り目'],
          [rid,3,'ロデオドライブ','x',88,bb('1600:良:1着:G1;1600:良:2着:G2;1600:良:1着:1勝;1600:重:1着:新馬','サートゥルナーリア','スニッツェル'),1.0,'course=1.0;bias=1.0',-2,'R-2;血統+0',-2,86,2,'','','',1.85,'','','','','','as_of=良20%稍重50%重30%;R38対象;初2000mは未知・血統加点0'],
          [rid,4,'ドゥレッツァ','○',98,bb('2400:稍重:8着:G2;2200:稍重:9着:G1;2410:良:3着:G1;2400:良:2着:G1;2050:良:5着:G1','ドゥラメンテ','More Than Ready'),1.0,'course=1.0;bias=1.0',0,'R+0',0,98,4,'','','',2.34,'','','','','','as_of=良20%稍重50%重30%;逃げ不在で位置優位'],
          [rid,5,'ゾロアストロ','▲',98,bb('2000:良:12着:G1;1800:良:1着:G3;1800:良:2着:G2;1600:良:3着:G3;1800:良:1着:未勝利','モーリス','ディープインパクト'),1.0,'course=1.0;bias=1.0',-2,'R-2',-2,96,3,'','','',1.67,'','','','','','as_of=良20%稍重50%重30%;55kg＋自在性'],
          [rid,6,'チェルヴィニア','☆',90,bb('1600:良:16着:G1;1800:良:5着:G2;1600:良:10着:G1;1800:良:7着:G2;1600:良:2着:G3','ハービンジャー','キングカメハメハ'),1.0,'course=1.0;bias=1.0',4,'R+4',4,94,5,'','','',4.35,'','','','','','as_of=良20%稍重50%重30%;R4.35妙味'],
          [rid,7,'ジュンブロッサム','-',82,bb('1800:良:9着:OP;1800:良:9着:G3;1600:稍重:11着:G3;1600:良:7着:L;1600:良:4着:G2','ワールドエース','クロフネ'),1.0,'course=1.0;bias=1.0',0,'R+0;血統+0',0,82,3,'','','',2.98,'','','','','','as_of=良20%稍重50%重30%;R38対象;2000近5走なし・血統加点0'],
          [rid,8,'ダノンシーマ','◎',102,bb('2500:良:3着:G2;3000:良:3着:G2;2000:良:1着:L;2400:良:1着:3勝;2400:良:1着:2勝','キタサンブラック','Include'),1.0,'course=1.0;bias=1.0',0,'R+0',0,102,4,'','','',2.50,'','','','','','as_of=良20%稍重50%重30%;A/B両対応＋2000実績＋川田継続'],
          [rid,9,'アーバンシック','△',93,bb('2000:良:14着:G2;2400:良:10着:G1海外;2000:良:5着:G1;2200:稍重:14着:G1;2500:稍重:3着:G2','スワーヴリチャード','ハービンジャー'),1.0,'course=1.0;bias=1.0',2,'R+2',2,95,4,'','','',3.93,'','','','','','as_of=良20%稍重50%重30%;G1級地力＋外枠差し'],
          [rid,10,'バレエマスター','☆',83,bb('1800:良:6着:OP;2000:良:2着:G3;2000:良:7着:L;1600:良:8着:L;1600:良:13着:OP','スピルバーグ','スウェプトオーヴァーボード'),1.0,'course=1.0;bias=1.0',2,'R+2',2,85,5,'','','',3.81,'','','','','','as_of=良20%稍重50%重30%;R3.81だが新潟2000G3好走を独立妙味根拠'],
          [rid,11,'ステレンボッシュ','-',88,bb('1600:良:10着:G1;1800:良:2着:G3;1800:稍重:7着:G3;2200:良:10着:G1;2000:稍重:15着:G2','エピファネイア','ルーラーシップ'),1.0,'course=1.0;bias=1.0',4,'R+4',4,92,5,'','','',4.09,'','','','','','as_of=良20%稍重50%重30%;R4.09・三連複紐保全']]
          append('log/predictions.csv',rows)
          append('log/bets.csv',[[rid,'三連複','軸8→4,5,6,9,10,11',15,100,1500,'','','中帯域・計画'],[rid,'ワイド','4-6 / 5-10 / 6-10',3,500,1500,'','','軸8抜け保全・計画']])
          fired={'R03':'③初2000mの単一不確実性があり頭固定候補にしない','R08':'pace_score=3・A押し出されスローを買い目前にロック','R11':'④⑤⑥⑨⑪を単独根拠で全消しせず紐保全','R18':'全発火行に馬名または数値根拠を記録','R20':'◎⑧は自在で前位置シナリオ・○④は機械先行','R25':'④⑥⑧⑨⑪等の重賞実績馬を5走精査','R28':'中帯域の三連複軸1頭＋ワイド・予算50:50を実装','R31':'⑧軸抜けでもワイド4-6・5-10・6-10が残る','R32':'券種間差は軸抜け保全目的として明記','R34':'base上位⑤等を印または三連複紐に保全','R35':'☆⑥R4.35・☆⑩R3.81は新潟2000G3好走を独立根拠として紐保全','R36':'final上位⑧102・④98の直積を三連複で保持','R37':'非軸ペア4-6・5-10・6-10の3点確保','R38':'③は1600のみ・⑦は1600-1800のみ。血統加点0を記録'}
          with open('log/rules_master.csv',encoding='utf-8') as f: rules=[r['rule_id'] for r in csv.DictReader(f)]
          append('log/rule_fires.csv',[[rid,r,1,1,'','',f'{fired[r]}; as_of=良20%稍重50%重30%'] if r in fired else [rid,r,0,'','','',f'非発火; as_of=良20%稍重50%重30%'] for r in rules])
          PY
      - name: Publish board
        run: python3 tools/publish_board.py --race-id 2026_niigata_kinen --source tmp/2026_niigata_kinen.html
      - name: Validate
        run: python3 log/validate.py
      - name: Commit generated files
        run: |
          rm -f tmp/2026_niigata_kinen.html .github/workflows/oneshot-niigata-kinen.yml
          rmdir tmp 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 新潟記念の予想ログとボードを追加'
          git push origin HEAD:feat/2026-niigata-kinen-prediction
